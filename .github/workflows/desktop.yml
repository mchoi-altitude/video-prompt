# Tests the Electron app (desktop/) on Linux and Windows, so a change made on one system can't quietly
# break the other. The Mac app has its own tests (scripts/test.sh).
name: desktop

on:
  push:
    paths: ["desktop/**", "Tests/VPCoreTests/Golden/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "Tests/VPCoreTests/Golden/**", ".github/workflows/desktop.yml"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
      - name: Cached tools (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: desktop/vendor/downloads
          key: vendor-${{ hashFiles('desktop/scripts/fetch-tools.mjs') }}
      - name: ffmpeg, whisper-cli and model (Windows)
        if: runner.os == 'Windows'
        run: node scripts/fetch-tools.mjs
      - run: npm ci
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: npm test
