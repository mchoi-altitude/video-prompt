<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
    <title>Drawing layer</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
      #count { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; font: 200 88px system-ui; color: #fff; text-shadow: 0 0 28px rgba(0, 0, 0, 0.55); pointer-events: none; }
      #count span { opacity: 0; animation: breathe 1s ease-in-out; }
      @keyframes breathe {
        0% { opacity: 0; transform: scale(0.96); }
        40%, 70% { opacity: 0.9; transform: scale(1); }
        100% { opacity: 0; transform: scale(1.02); }
      }
      /* Just outside the region, so it marks the edge on screen without being in the video. */
      #outline { position: fixed; box-sizing: border-box; border: 3px solid #e5484d; border-radius: 3px; opacity: 0; transition: opacity 700ms ease; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="outline"></div>
    <div id="count"></div>
    <script src="overlay.js"></script>
  </body>
</html>
