<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
    <title>Select area</title>
    <style>
      html, body { margin: 0; height: 100%; background: rgba(0, 0, 0, 0.3); cursor: crosshair; user-select: none; overflow: hidden; font: 15px system-ui; }
      #box { display: none; position: fixed; border: 2px solid #fff; background: rgba(255, 255, 255, 0.08); box-sizing: border-box; }
      #hint { position: fixed; top: 40%; left: 50%; transform: translateX(-50%); padding: 12px 18px; border-radius: 8px; background: #1e1e1e; color: #fff; }
    </style>
  </head>
  <body>
    <div id="box"></div>
    <div id="hint">Drag across the area to record. Esc cancels.</div>
    <script src="picker.js"></script>
  </body>
</html>
