<html>
  <head>

    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
    <title>Drawing layer</title>

    </style>
  </head>

    <canvas id="c"></canvas>
    <div id="count"></div>
    <script src="overlay.js"></script>
  </body>
