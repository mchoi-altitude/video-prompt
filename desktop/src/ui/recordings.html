<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src file:" />
    <title>Recordings</title>
    <style>
      :root { color-scheme: light dark; --line: color-mix(in srgb, CanvasText 14%, transparent); --quiet: color-mix(in srgb, CanvasText 58%, transparent); }
      html, body { margin: 0; height: 100%; }
      body { display: flex; flex-direction: column; font: 13px system-ui; background: Canvas; color: CanvasText; }
      header, footer { display: flex; align-items: center; gap: 14px; padding: 12px 22px; flex: none; }
      header { border-bottom: 1px solid var(--line); }
      footer { border-top: 1px solid var(--line); }
      .quiet { color: var(--quiet); }
      .grow { flex: 1; }
      select { font: inherit; padding: 3px 6px; }
      button { font: inherit; padding: 5px 11px; white-space: nowrap; }
      #list { flex: 1; overflow-y: auto; padding: 0 22px; }
      #empty { height: 100%; display: flex; align-items: center; justify-content: center; }
      .row { display: flex; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); }
      .row:last-child { border-bottom: 0; }
      .thumb { width: 92px; height: 52px; flex: none; border-radius: 5px; object-fit: cover; object-position: left top; background: color-mix(in srgb, CanvasText 20%, transparent); }
      .text { flex: 1; min-width: 120px; }
      .title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sub { font-size: 12px; margin-top: 3px; color: var(--quiet); }
      .state { flex: none; width: 190px; }
      .expires { font-size: 12px; margin-top: 3px; color: #c77800; }
      .size { flex: none; width: 64px; text-align: right; font: 12px ui-monospace, monospace; color: var(--quiet); }
      .action { flex: none; width: 124px; text-align: right; }
      .trash { flex: none; padding: 5px; background: none; border: 0; color: var(--quiet); border-radius: 5px; line-height: 0; }
      .trash:hover { background: var(--line); color: CanvasText; }
      .trash svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </head>
  <body>
    <header>
      <span id="usage" class="quiet"></span>
      <span class="grow"></span>
      <label>Auto-delete
        <select id="retention">
          <option value="days:1">after 1 day</option>
          <option value="days:3">after 3 days</option>
          <option value="days:7">after 7 days</option>
          <option value="days:30">after 30 days</option>
          <option value="last:20">keep the last 20</option>
          <option value="never">never</option>
        </select>
      </label>
    </header>
    <div id="list"></div>
    <footer>
      <button id="select-all">Select all</button>
      <span class="quiet">Deleted recordings go to the Trash, so a mistake is recoverable.</span>
      <span class="grow"></span>
      <button id="delete-selected" disabled>Delete selected</button>
    </footer>
    <script src="recordings.js"></script>
  </body>
</html>
